name: iOS Build

on:
  push:
    branches: [ main, master, dev ]        # ← added dev (you push to dev)
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show commit and Swift files
        shell: bash
        run: |
          echo "Commit being built:"
          git log -1 --oneline
          echo
          echo "Swift files under iosApp:"
          find iosApp -name "*.swift" -not -path "*/build/*" | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS Simulator App
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/iosDerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/xcodebuild.log"
          echo "===== Kotlin errors (e:) ====="
          grep -n "^e: " "$LOG" | head -50 || true
          echo
          echo "===== Swift / Xcode errors (error:) ====="
          grep -n "error:" "$LOG" | grep -v "validate-development-assets" | head -50 || true
          echo
          echo "===== Last 40 lines of the build ====="
          tail -n 40 "$LOG"

      - name: Locate built app
        id: app
        shell: bash
        run: |
          PRODUCTS="$GITHUB_WORKSPACE/build/iosDerivedData/Build/Products/Debug-iphonesimulator"
          echo "Contents of products dir:"
          ls -la "$PRODUCTS" || true
          APP_PATH=$(find "$PRODUCTS" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $PRODUCTS"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist" || echo "unknown")
          echo "App:       $APP_PATH"
          echo "Bundle id: $BUNDLE_ID"
          echo "path=$APP_PATH"  >> "$GITHUB_OUTPUT"
          echo "name=$APP_NAME"  >> "$GITHUB_OUTPUT"
          echo "dir=$PRODUCTS"   >> "$GITHUB_OUTPUT"

      - name: Zip app for Appetize
        shell: bash
        run: |
          cd "${{ steps.app.outputs.dir }}"
          zip -r "$GITHUB_WORKSPACE/iosApp-sim.zip" "${{ steps.app.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: iosApp-sim.zip
