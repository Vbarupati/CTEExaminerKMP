name: ios-build

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [ dev, main, master ]

jobs:
  ios-build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build shared framework (iOS simulator)
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS app (simulator)
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip the .app for Appetize
        run: |
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/iosApp-sim.zip" iosApp.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: iosApp-sim.zip
