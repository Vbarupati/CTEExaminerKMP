name: ios-build

on:
  workflow_dispatch:
  push:
    branches: [ dev, main, master ]

jobs:
  ios-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - name: Build shared framework (Intel simulator)
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosX64
      - name: Build iOS app
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Zip the .app
        run: |
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/iosApp-sim.zip" CTEExaminerKMP.app
      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: iosApp-sim.zip
