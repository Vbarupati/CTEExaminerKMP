name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Which commit and which Swift files are being built
      - name: Show commit and Swift files
        shell: bash
        run: |
          echo "Commit being built:"
          git log -1 --oneline
          echo
          echo "Swift files under iosApp:"
          find iosApp -name "*.swift" -not -path "*/build/*" | sort
          echo
          echo "ContentView opens after login:"
          grep -rn "HomeView()\|MainView(" iosApp --include=ContentView.swift || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS Simulator App
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/iosDerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
      # Runs only when the build fails: prints just the error lines
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/xcodebuild.log"
          echo "===== Kotlin errors (e:) ====="
          grep -n "^e: " "$LOG" | head -50 || true
          echo
          echo "===== Swift / Xcode errors (error:) ====="
          grep -n "error:" "$LOG" | grep -v "validate-development-assets" | head -50 || true
          echo
          echo "===== Last 40 lines of the build ====="
          tail -n 40 "$LOG"
      - name: Find iOS App
        if: always()
        shell: bash
        run: |
          echo "Checking expected build output..."
          ls -la "$GITHUB_WORKSPACE/build/iosDerivedData/Build/Products/" || true
          echo "Searching for generated .app..."
          find "$GITHUB_WORKSPACE" -type d -name "*.app" -print
      # Locate the built .app once and share its path / bundle id with later steps
      - name: Locate built app
        id: app
        shell: bash
        run: |
          PRODUCTS="$GITHUB_WORKSPACE/build/iosDerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH=$(find "$PRODUCTS" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $PRODUCTS"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "App: $APP_PATH"
          echo "Bundle id: $BUNDLE_ID"
          echo "path=$APP_PATH"       >> "$GITHUB_OUTPUT"
          echo "name=$APP_NAME"       >> "$GITHUB_OUTPUT"
          echo "dir=$PRODUCTS"        >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
      # Zip the .app BEFORE uploading: upload-artifact does not keep file
      # permissions, so an uploaded raw .app loses its executable bit.
      # This zip is ready to upload to Appetize as-is.
      - name: Zip app for Appetize
        shell: bash
        run: |
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/iosApp-sim.zip" CTEExaminerKMP.app
      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: iosApp-sim.zip
